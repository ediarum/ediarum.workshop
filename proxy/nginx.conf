# The stack's only entry point, as in the instance: ediarum-platform's docker/proxy.conf plus
# deploy/proxy/apps.conf. Each app gets /api/<id>/ (backend, prefix stripped) and /apps/<id>/
# (frontend bundle with embed.js).
#
# Every upstream host is in a variable: only then does nginx look it up again (resolver, below)
# instead of once at start, so a recreated container (new address) is reached without restarting
# the proxy (a literal host would keep the old address and answer 502). With a variable, nginx
# doesn't strip the location's prefix, so $upstream_uri does: the request URI as the client sent
# it (still encoded, with its query), minus /api/<id>, /apps/<id> or /webdav.
map $request_uri $upstream_uri {
    ~^/(?:api|apps)/[^/]+(?<rest>/.*)$  $rest;
    ~^/webdav(?<rest>/connection/.*)$   $rest;
    default                             $request_uri;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # webdav's upload limit.
    client_max_body_size 100m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Docker's DNS, so a restarted container's new address is picked up.
    resolver 127.0.0.11 valid=10s;

    set $webdav webdav;
    set $fileservice fileservice;
    set $id_api id-api;
    set $id_frontend id-frontend;
    set $index_api index-api;
    set $index_frontend index-frontend;
    set $platform platform;

    # ediarum.webdav: auth provider, admin app, WebDAV endpoint (oXygen).
    location /api/auth/          { proxy_pass http://$webdav:8080; }
    location /api/webdav/        { proxy_pass http://$webdav:8080; proxy_buffering off; proxy_read_timeout 1h; }
    location /apps/webdav/       { proxy_pass http://$webdav:8080; }
    location /webdav/connection/ { proxy_pass http://$webdav:8080$upstream_uri; proxy_request_buffering off; }

    # Register lists the project framework asks for but no service provides (letters, comments,
    # Zotero, GeoNames, …): an empty list instead of an error dialog in oXygen. The workshop's
    # oXygen project file points those editor variables here.
    location ~ ^/api/index/[^/]+/oxygen-unavailable {
        default_type application/xml;
        return 200 '<ul xmlns:tei="http://www.tei-c.org/ns/1.0"/>';
    }

    location /api/fileservice/   { proxy_pass http://$fileservice:8000$upstream_uri; }
    location /api/id/            { proxy_pass http://$id_api:8000$upstream_uri; }
    location /apps/id/           { proxy_pass http://$id_frontend$upstream_uri; }
    location /api/index/         { proxy_pass http://$index_api:8000$upstream_uri; }
    location /apps/index/        { proxy_pass http://$index_frontend$upstream_uri; }

    location / { proxy_pass http://$platform; }
}
